[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-serving"
version = "0.1.0"
description = "ReServe: recovery-aware scheduling for dynamic-precision LLM serving"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4"]
monitor = ["nvidia-ml-py>=12", "psutil>=5.9"]
hf = ["torch>=2.2", "transformers>=4.45", "accelerate>=1", "bitsandbytes>=0.45"]
vllm = ["vllm"]
dev = ["ruff>=0.8,<1"]

[project.scripts]
recovery-run = "recovery_serving.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
